name: "laya-evals regression gate"
description: >-
  Fail the build when accuracy or calibration regresses: compare a fresh
  measurement JSON against a committed baseline. Pure Python 3, no model
  downloads, no laya/torch dependency - the gate only needs your two JSON
  files.
author: "Gjusev"
branding:
  icon: "shield"
  color: "gray-dark"
inputs:
  current:
    description: "Path to the fresh measurement JSON"
    required: true
  baseline:
    description: "Path to the committed baseline JSON"
    required: true
  metrics:
    description: >-
      Metric specs, one per line: path:goal[:tolerance] - path is a dotted
      path into the JSON, goal is max (accuracy-like) or min (ECE-like),
      and tolerance defaults to 0.02.
    required: true
outputs:
  regressed:
    description: "'true' when any metric failed its gate"
    value: ${{ steps.gate.outputs.regressed }}
runs:
  using: "composite"
  steps:
    - id: gate
      shell: bash
      env:
        METRICS: ${{ inputs.metrics }}
        CURRENT: ${{ inputs.current }}
        BASELINE: ${{ inputs.baseline }}
      run: |
        ARGS=()
        while IFS= read -r spec; do
          spec="${spec%$'\r'}"   # tolerate CRLF from workflow editors
          [ -n "$spec" ] && ARGS+=(--metric "$spec")
        done <<< "$METRICS"
        if python3 "${{ github.action_path }}/gate.py" \
            --current "$CURRENT" \
            --baseline "$BASELINE" \
            "${ARGS[@]}"; then
          echo "regressed=false" >> "$GITHUB_OUTPUT"
        else
          echo "regressed=true" >> "$GITHUB_OUTPUT"
          exit 1
        fi
